<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Camera</title>
  <rect width="64" height="64" rx="14" fill="#15110e"/>
  <!-- shutter button and viewfinder -->
  <rect x="12" y="15" width="8" height="5" rx="1.5" fill="#e2ac66"/>
  <rect x="23" y="12" width="18" height="10" rx="2.5" fill="#f0e7d6"/>
  <!-- body -->
  <rect x="7" y="19" width="50" height="34" rx="7" fill="#f0e7d6"/>
  <!-- lens -->
  <circle cx="32" cy="36" r="12.5" fill="#15110e"/>
  <circle cx="32" cy="36" r="7.5" fill="#ff8a3d"/>
  <circle cx="29" cy="33" r="2.2" fill="#ffe2c4"/>
  <!-- flash -->
  <rect x="46" y="24" width="6" height="4" rx="1" fill="#15110e"/>
</svg>
