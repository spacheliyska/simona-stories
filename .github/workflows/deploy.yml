# CI/CD for the site.
# - Pull requests: build the site to check nothing is broken.
# - Pushes to main (or a manual run): build, check, publish to GitHub Pages,
#   then check the live site. A build that fails a check is never published,
#   so the live site keeps its last good version.
# Actions are pinned to exact versions (commit hashes), so a hijacked release can't
# run here; Dependabot (.github/dependabot.yml) proposes updates.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway (stale pull request builds are cancelled).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      HAS_PHOTOS_SOURCE: ${{ secrets.PHOTOS_REPO != '' && secrets.PHOTOS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the photos
        id: photos
        if: github.event_name != 'pull_request' && env.HAS_PHOTOS_SOURCE == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.PHOTOS_REPO }}
          ssh-key: ${{ secrets.PHOTOS_DEPLOY_KEY }}
          path: public/photos
          persist-credentials: false

      # Never go up without photos: if they can't be fetched, reuse the ones of the last good deploy.
      - name: Reuse the photos of the last good deploy
        if: github.event_name != 'pull_request' && steps.photos.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Photos taken from the last good deploy."
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name github-pages --dir "$RUNNER_TEMP/last-good"
          mkdir -p "$RUNNER_TEMP/last-good/site" public/photos
          tar -xf "$RUNNER_TEMP/last-good/artifact.tar" -C "$RUNNER_TEMP/last-good/site"
          cp "$RUNNER_TEMP/last-good/site/photos/"*.jpg public/photos/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Leave empty once you use a custom domain (site served from '/').
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check the build
        run: node scripts/check-build.mjs
        env:
          REQUIRE_PHOTOS: ${{ github.event_name != 'pull_request' }}

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read # to see whether GitHub's own branch publishing is still running
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Settings → Pages → Source is "Deploy from a branch", GitHub also publishes the raw
      # source on every push, which shows a blank page. Wait for it so the built site lands last.
      - name: Wait for branch publishing, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = legacy ]; then
            echo "::warning::Settings → Pages → Source is 'Deploy from a branch'. Switch it to 'GitHub Actions'."
          fi
          for i in $(seq 1 30); do
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=dynamic" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' 2>/dev/null)
            [ "${busy:-0}" = 0 ] && break
            echo "Branch publishing still running, waiting..."
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the live site
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in $(seq 1 18); do
            ok=true
            for page in "" "bg/"; do
              js=$(curl -fsSL "${URL}${page}?check=${GITHUB_RUN_ID}-$i" | grep -oE 'assets/[A-Za-z0-9_-]+\.js' | head -1)
              [ -n "$js" ] && curl -fsS -o /dev/null "${URL}${js}" || ok=false
            done
            curl -fsS -o /dev/null "${URL}photos/me.jpg?check=$i" || ok=false
            if $ok; then
              echo "The live site is up: ${URL} and ${URL}bg/"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live site doesn't look right. Put the last good version back: revert the last change and push."
          exit 1

  # The uploaded copy of the site is only needed for the deploy: delete this run's copy once it's over.
  cleanup:
    if: always() && github.event_name != 'pull_request'
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this run's uploaded site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Deleted artifact $id"
          done
