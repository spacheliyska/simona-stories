# CI/CD for the site.
# - Pull requests: build the site to check nothing is broken.
# - Pushes to main (or a manual run): build and publish to GitHub Pages.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The photos are kept out of the public repo (see .gitignore). Without them the
      # site would go live with empty frames, so stop here: the live site keeps its last version.
      - name: Stop if the photos are missing
        if: github.event_name != 'pull_request'
        run: |
          if ! ls public/photos | grep -qiE '\.(jpe?g|png|webp|avif)$'; then
            echo "::error::No photos in public/photos (they are kept out of git). Not deploying, so the live site keeps its photos."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Leave empty once you use a custom domain (site served from '/').
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
